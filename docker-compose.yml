name: frontflow-bi

x-superset-env: &superset-env
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_DB: ${POSTGRES_SUPERSET_DB}
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
  GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
  CORS_ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
  PYTHONPATH: /app/pythonpath
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SUPERSET_DB: ${POSTGRES_SUPERSET_DB}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      SUPERSET_RO_USER: ${SUPERSET_RO_USER}
      SUPERSET_RO_PASSWORD: ${SUPERSET_RO_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host port only, for connecting with psql from your machine. Services
      # reach Postgres as `postgres:5432` over the compose network regardless,
      # so changing this cannot break the stack. Override when 5432 is already
      # taken by another project.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # NOTE ON THE IMAGE PIN (both Superset services, see superset/Dockerfile):
  # 5ce52e5 is a master build, not a tagged release. It is pinned there because
  # the in-place dashboard refresh needs the `setDataMask` switchboard method,
  # which Superset 4.1.1 and 5.0.0 do not implement. The vendored SDK in
  # frontend/src/vendor/superset-embedded-sdk is taken from the SAME commit and
  # the two must be bumped together — see that directory's README.
  #
  # One-shot: migrate Superset's metadata DB, create the admin user, and
  # register the application database as a Superset connection.
  superset-init:
    build: ./superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *superset-env
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      APP_DB_URI: postgresql://${SUPERSET_RO_USER}:${SUPERSET_RO_PASSWORD}@postgres:5432/${POSTGRES_APP_DB}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap.sh:/app/bootstrap.sh:ro
    command: ["bash", "/app/bootstrap.sh"]

  superset:
    build: ./superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment: *superset-env
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_APP_DB}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_DASHBOARD_EMBED_UUID: ${SUPERSET_DASHBOARD_EMBED_UUID}
    volumes:
      - ./backend:/code
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_SUPERSET_DOMAIN: http://localhost:${SUPERSET_PORT:-8088}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres-data:
  redis-data:
